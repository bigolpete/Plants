<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lizzy's Plants</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Track garden and houseplants, watering schedules, light needs and companion plants.">
<meta name="theme-color" content="#111713">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plants">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone-first garden notebook. Sticky header, one scrolling column, bottom tab bar, bottom sheets for detail and editing. */
:root {
  color-scheme: dark;
  --bg: #111713;
  --surface: #19211C;
  --surface-2: #212B24;
  --ink: #E3EAE2;
  --muted: #98A79B;
  --line: #2C3730;
  --leaf: #7EBC87;
  --leaf-ink: #0F1A12;
  --leaf-soft: #213426;
  --water: #7DB6DE;
  --water-soft: #1B2B37;
  --warn: #EC8C70;
  --warn-soft: #3A241D;
  --sun: #E3B24B;
  --c-veg: #E07E63;
  --c-herb: #8DC06F;
  --c-flower: #E3B24B;
  --c-fruit: #E07FA4;
  --c-house: #7DBEC4;
  --c-other: #A9AE98;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --tabbar-h: 62px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid transparent; }
.top.scrolled { border-bottom-color: var(--line); }
.top .wrap { padding-block: 14px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.7rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.summary { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
.summary b { color: var(--water); font-weight: 600; }
.head-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.backup-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sync { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; padding-bottom: 4px; }

main { padding-block: 8px calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; margin: 0; text-wrap: balance; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.section { display: grid; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* Filter chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: .9rem; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* Plant list */
.group { display: grid; gap: 6px; }
.group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 2px; }
.list { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: none; border: 0; text-align: left; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:active { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; }
.row-title, .row-sub { display: block; }
.row-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-sub { font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mono { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.05rem; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.mono.lg { width: 56px; height: 56px; border-radius: 16px; font-size: 1.4rem; }
.mono.sm { width: 32px; height: 32px; border-radius: 9px; font-size: .85rem; }

.pill { flex: none; display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 4px 9px; font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill.due { background: var(--water-soft); color: var(--water); }
.pill.late { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--leaf-soft); color: var(--leaf); }
.pill svg { width: 12px; height: 12px; }

/* Cards */
.card { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; }
.card.warn { box-shadow: none; background: var(--warn-soft); }
.card.warn h3 { color: var(--warn); }
h3 { font-size: 1rem; margin: 0; font-weight: 600; }
.card p { margin: 0; }

/* Buttons */
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.btn.primary { background: var(--leaf); color: var(--leaf-ink); }
.btn.water { background: var(--water); color: var(--surface); }
.btn.danger { background: var(--warn-soft); color: var(--warn); }
.btn.ghost { background: transparent; color: var(--leaf); padding-inline: 8px; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 0; }
.mini { border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 600; font-size: .85rem; background: var(--water-soft); color: var(--water); display: inline-flex; gap: 5px; align-items: center; flex: none; min-height: 36px; }
.mini svg { width: 14px; height: 14px; }
.mini.done { background: var(--leaf-soft); color: var(--leaf); }

.fab { position: fixed; z-index: 21; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom, 0px)); border: 0; border-radius: 999px; background: var(--leaf); color: var(--leaf-ink); font-weight: 700; padding: 14px 20px; box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 6px; }
.fab svg { width: 18px; height: 18px; }

/* Tab bar */
.tabs { position: fixed; z-index: 22; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.tabs .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }

/* Planner */
.season-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.season-top > div { min-width: 0; }
.season h2 { font-size: 1.45rem; }
.frostline { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.frostline .bar i { background: linear-gradient(90deg, var(--water), var(--leaf) 30%, var(--sun) 60%, var(--leaf) 85%, var(--water)); }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--leaf); border-radius: 4px; }
.bar.over i { background: var(--warn); }
.bed-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.plan-item { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 12px 0 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.plan-item .row-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.plan-item .sqft { flex: none; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.dates { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .82rem; color: var(--muted); }
.dates b { color: var(--ink); font-weight: 600; }
.warnline { font-size: .82rem; color: var(--warn); }
.tips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .82rem; color: var(--muted); }
.tip-btn { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 6px 11px; font-size: .85rem; color: var(--leaf); font-weight: 600; }
.task { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task .row-main { flex: 1; min-width: 0; }
.task-text { font-weight: 600; display: block; }
.task.done .task-text { text-decoration: line-through; color: var(--muted); }
.tick { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: none; display: grid; place-items: center; color: transparent; padding: 0; }
.tick svg { width: 14px; height: 14px; }
.tick[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); }
.month { font-family: var(--f-display); font-size: 1.05rem; margin: 4px 2px 0; }
.bedrow { display: grid; grid-template-columns: minmax(0, 1fr) 58px auto 58px 36px; gap: 6px; align-items: center; }
.bedrow .input { padding: 10px 8px; min-height: 42px; }
.bedrow .x { color: var(--muted); font-size: .85rem; }
.preview { background: var(--surface); border-radius: 14px; padding: 14px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.preview .line { display: grid; grid-template-columns: 96px 1fr; gap: 8px; font-size: .9rem; }
.preview .line span:first-child { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; padding-top: 2px; }
.tab { border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--leaf); }
.tab .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--water); color: var(--surface); border-radius: 999px; font-size: .65rem; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 5px; font-variant-numeric: tabular-nums; }

/* Empty state */
.empty { text-align: left; padding: 22px 18px; display: grid; gap: 12px; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.empty h2 { font-size: 1.4rem; }
.empty p { margin: 0; color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.quick button { border: 1px dashed var(--line); background: var(--bg); border-radius: 999px; padding: 8px 12px; font-weight: 500; font-size: .9rem; }

/* Sheet */
#sheetRoot { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: rgba(10,16,12,.45); animation: fade .18s ease-out; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: rise .24s cubic-bezier(.2,.8,.2,1); max-width: 680px; margin: 0 auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.close { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.close svg { width: 18px; height: 18px; }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, #toast { animation: none !important; } }

.hero { display: flex; gap: 14px; align-items: center; }
.hero h2 { font-size: 1.5rem; line-height: 1.15; }
.hero-text { min-width: 0; }

/* Care stats */
.care { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: 14px; padding: 12px; display: grid; gap: 6px; box-shadow: var(--shadow); min-width: 0; }
.stat .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.stat .val { font-weight: 600; font-size: 1.02rem; }
.stat .hint { font-size: .8rem; color: var(--muted); }
.meter { display: flex; gap: 3px; }
.meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.meter.sun i.on { background: var(--sun); }
.meter.drop i.on { background: var(--water); }
.note { background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: .92rem; box-shadow: var(--shadow); }
.note b { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }

/* Companion list */
.rel { display: grid; gap: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.rel-item { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-start; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.rel-item:first-child { border-top: 0; }
.rel-item .row-main { display: grid; gap: 2px; }
.rel-name { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rel-why { font-size: .88rem; color: var(--muted); }
.rel.bad .rel-name { color: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--leaf-soft); color: var(--leaf); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.here { background: var(--water-soft); color: var(--water); }
.tag.n { background: var(--surface-2); color: var(--muted); }
.tag.r3 { background: var(--leaf); color: var(--leaf-ink); }
.tag.r2 { background: var(--leaf-soft); color: var(--leaf); }
.tag.r1 { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.tiers { display: grid; gap: 6px; font-size: .82rem; color: var(--muted); }
.tiers > div { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; }
.tiers .tag { justify-self: start; }

/* Form */
.field { display: grid; gap: 6px; min-width: 0; }
.sheet-body { overflow-x: hidden; }
.sheet-body > *, #plantForm > * { min-width: 0; }
input[type="date"].input { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
.field > label, .field > .label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; min-height: 46px; }
textarea.input { min-height: 80px; resize: vertical; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; font-weight: 600; flex: none; }
.stepper output { flex: 1; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.picker { display: grid; gap: 6px; max-height: 260px; overflow-y: auto; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); }
.pick { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; background: none; text-align: left; border-top: 1px solid var(--line); width: 100%; }
.pick:first-child { border-top: 0; }
.chosen { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.chosen .row-main { min-width: 0; }
.spots { display: flex; flex-wrap: wrap; gap: 6px; }
.spots button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; font-size: .9rem; font-weight: 500; }
.spots button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--leaf-ink); }

/* Lookup grid */
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 38px; }
.grid-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.grid-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .88rem; font-weight: 500; }
.grid-chips button.owned { border-color: var(--leaf); color: var(--leaf); }
.pair { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.pair .amp { color: var(--muted); font-weight: 400; }

.banner { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: .85rem; color: var(--muted); }

#toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; font-weight: 500; font-size: .92rem; box-shadow: var(--shadow); animation: rise .2s ease-out; max-width: calc(100% - 32px); }
#toast button { border: 0; background: transparent; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 6px 8px; }
#toast:not(:has(button)) { padding-right: 16px; }

@media (min-width: 560px) {
  .care { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <div>
      <h1>Lizzy's Plants</h1>
      <p class="summary" id="summary">Loading your garden…</p>
    </div>
    <div class="head-actions">
      <span class="sync" id="sync"></span>
      <button class="icon-btn" id="backupBtn" type="button" aria-label="Back up or restore plants">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M8 10l4 4 4-4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</header>

<main id="main" class="wrap" aria-live="polite"></main>

<button class="fab" id="fab" type="button" aria-label="Add a plant">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fabLabel">Add plant</span>
</button>

const REL = {};
Object.keys(DB).forEach(id => REL[id] = { good: new Map(), bad: new Map() });
const expand = id => id === 'brassica' ? ['cabbage', 'broccoli', 'kale'] : [id];
function link(list, kind) {
  list.forEach(([a, b, why]) => {
    expand(a).forEach(x => expand(b).forEach(y => {
      if (!DB[x] || !DB[y]) { console.warn('Unknown plant in relation', x, y); return; }
      if (!REL[x][kind].has(y)) REL[x][kind].set(y, why);
      if (!REL[y][kind].has(x)) REL[y][kind].set(x, why);
    }));
  });
}

/* How strong each good pairing is.
   3 = Top pick: well-known, widely observed benefit (Three Sisters, trap crops, nematode control, pest predators).
   2 = Good: a practical benefit (shade, space, nitrogen, pollinators, scent masking).
   1 = Folk tip: a traditional pairing with little evidence behind it. */
const pairKey = (a, b) => [a, b].sort().join('|');
const STRONG = [
  ['tomato','basil'], ['tomato','marigold'], ['tomato','nasturtium'], ['bean','corn'], ['bean','squash'], ['corn','squash'],
  ['carrot','onion'], ['brassica','dill'], ['brassica','nasturtium'], ['squash','borage'], ['spinach','radish'],
  ['cucumber','radish'], ['squash','nasturtium'], ['cucumber','dill'],
];
const WEAK = [
  ['basil','oregano'], ['pea','mint'], ['tomato','mint'], ['eggplant','thyme'], ['bean','rosemary'], ['bean','eggplant'],
  ['brassica','chamomile'], ['brassica','sage'], ['brassica','rosemary'], ['carrot','sage'], ['carrot','rosemary'],
  ['garlic','strawberry'], ['basil','asparagus'], ['strawberry','thyme'], ['brassica','oregano'], ['potato','brassica'],
];
const STR = new Map();
const tierSet = list => new Set(list.flatMap(([a, b]) => expand(a).flatMap(x => expand(b).map(y => pairKey(x, y)))));
const strongSet = tierSet(STRONG), weakSet = tierSet(WEAK);
GOOD.forEach(([a, b, why]) => expand(a).forEach(x => expand(b).forEach(y => {
  const k = pairKey(x, y);
  if (STR.has(k)) return;
  STR.set(k, strongSet.has(k) ? 3 : (weakSet.has(k) || /said to/.test(why)) ? 1 : 2);
})));
const strength = (a, b) => STR.get(pairKey(a, b)) || 2;
const TIER = { 3: 'Top pick', 2: 'Good', 1: 'Folk tip' };
const tierTag = s => `<span class="tag r${s}">${TIER[s]}</span>`;

/* ---------------------------------------------------------------
   Helpers
---------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const fmtDate = s => parseISO(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const newId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const typeOf = p => DB[p.type] || null;
const catOf = p => typeOf(p)?.cat || 'other';
const lightOf = p => LIGHT[p.light || typeOf(p)?.light] || null;
const displayName = p => p.name?.trim() || typeOf(p)?.name || p.customType || 'Plant';
const typeName = p => typeOf(p)?.name || p.customType || 'Custom plant';
const spotKey = p => (p.spot || '').trim().toLowerCase() || (p.setting === 'indoor' ? 'indoors' : 'garden');
const spotLabel = p => (p.spot || '').trim() || (p.setting === 'indoor' ? 'Indoors' : 'Garden');

function initials(name) {
  const w = String(name).replace(/[^\p{L}\s]/gu, '').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return '•';
  return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[1][0]).replace(/^./, c => c.toUpperCase());
}
function mono(name, cat, size = '') {
  return `<span class="mono ${size}" style="--c: var(--c-${cat})" aria-hidden="true">${esc(initials(name))}</span>`;
}
function meter(lvl, kind) {
  return `<div class="meter ${kind}" aria-hidden="true">${[1,2,3,4,5].map(i => `<i class="${i <= lvl ? 'on' : ''}"></i>`).join('')}</div>`;
}

/* Watering status */
function waterInfo(p) {
  const every = Math.max(1, Number(p.waterEvery) || typeOf(p)?.water || 7);
  if (!p.lastWatered) return { every, left: 0, label: 'Water today', cls: 'due', never: true };
  const left = every - daysBetween(p.lastWatered, todayISO());
  if (left < 0) return { every, left, label: `${-left}d overdue`, cls: 'late' };
  if (left === 0) return { every, left, label: 'Water today', cls: 'due' };
  if (left === 1) return { every, left, label: 'Tomorrow', cls: '' };
  return { every, left, label: `In ${left} days`, cls: '' };
}
const isDue = p => waterInfo(p).left <= 0;

/* ---------------------------------------------------------------
   Storage: shared artifact database when available, this device otherwise
---------------------------------------------------------------- */
const LOCAL_KEY = 'lizzys-plants-v1';
const Store = {
  mode: 'loading', col: null, plants: [], loaded: false, slow: false, readOnly: false,
  async init() {
    let db = null;
    const embedded = window.self !== window.top;
    for (let i = 0; i < 15 && embedded && !window.claude?.use; i++) await new Promise(r => setTimeout(r, 100));
    try { if (window.claude?.use) db = await window.claude.use('db'); } catch (e) { db = null; }
    Plan.init(db);
    if (db) {
      this.mode = 'cloud';
      this.col = db.collection('plants');
      const timer = setTimeout(() => { if (!this.confirmed) { this.slow = true; render(); } }, 10000);
      this.col.onSnapshot(snap => {
        this.plants = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        this.loaded = true;
        if (!snap.metadata.fromCache) { this.confirmed = true; this.slow = false; clearTimeout(timer); }
        render();
      }, err => {
        clearTimeout(timer);
        this.loaded = true; this.error = err.code;
        render();
      });
    } else {
      this.mode = 'local';
      try { this.plants = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch (e) { this.plants = []; }
      this.loaded = true;
      render();
    }
  },
  persistLocal() { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(this.plants)); } catch (e) {} },
  async save(p) {
    const { id, ...data } = p;
    data.updated = Date.now();
    if (this.mode === 'cloud') {
      try { await this.col.doc(id).set(data); }
      catch (e) { this.handleWriteError(e); return false; }
    } else {
      const i = this.plants.findIndex(x => x.id === id);
      if (i >= 0) this.plants[i] = { ...data, id }; else this.plants.push({ ...data, id });
      this.persistLocal(); render();
    }
    return true;
  },
  async remove(id) {
    if (this.mode === 'cloud') {
      try { await this.col.doc(id).delete(); }
      catch (e) { this.handleWriteError(e); return false; }
    } else {
      this.plants = this.plants.filter(x => x.id !== id);
      this.persistLocal(); render();
    }
    return true;
  },
  handleWriteError(e) {
    if (e?.code === 'invalid_argument') { this.readOnly = true; toast('You can view this garden but not change it.'); }
    else if (e?.code === 'quota_exceeded') toast('The garden is full. Remove a few plants to add more.');
    else toast('Couldn’t save that change. Check your connection and try again.');
    render();
  },
  get(id) { return this.plants.find(p => p.id === id); },
  async applyImport(list, replace) {
    if (this.mode === 'cloud') {
      if (replace) {
        for (const p of this.plants.slice()) if (!list.some(x => x.id === p.id)) { if (!await this.remove(p.id)) return false; }
      }
      for (const p of list) { if (!await this.save(p)) return false; }
      return true;
    }
    const map = new Map(replace ? [] : this.plants.map(p => [p.id, p]));
    list.forEach(p => map.set(p.id, { ...p, updated: Date.now() }));
    this.plants = [...map.values()];
    this.persistLocal(); render();
    return true;
  },
};

/* ---------------------------------------------------------------
   Backup & restore
---------------------------------------------------------------- */
const BACKUP_KEY = 'lizzys-plants-last-backup';
function lastBackup() { try { return localStorage.getItem(BACKUP_KEY) || ''; } catch (e) { return ''; } }
function markBackup() { try { localStorage.setItem(BACKUP_KEY, todayISO()); } catch (e) {} }

async function exportBackup() {
  const payload = { app: 'lizzys-plants', version: 2, exported: new Date().toISOString(), plants: Store.plants, plan: Plan.data };
  const name = `lizzys-plants-${todayISO()}.json`;
  const file = new File([JSON.stringify(payload, null, 2)], name, { type: 'application/json' });
  const touch = window.matchMedia?.('(pointer: coarse)').matches;
  if (touch && navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "Lizzy's Plants backup" });
      markBackup(); toast('Backup saved'); render(); return;
    } catch (e) {
      if (e?.name === 'AbortError') return;
    }
  }
  try {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    markBackup(); toast(`Downloaded ${name}`); render();
  } catch (e) {
    toast('This browser blocked the download.');
  }
}

function cleanPlant(x) {
  if (!x || typeof x !== 'object' || Array.isArray(x)) return null;
  const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';
  const date = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
  const type = typeof x.type === 'string' && DB[x.type] ? x.type : '';
  const customType = str(x.customType, 80).trim();
  if (!type && !customType) return null;
  return {
    id: typeof x.id === 'string' && /^[A-Za-z0-9_-]{1,60}$/.test(x.id) ? x.id : newId(),
    type, customType,
    name: str(x.name, 80),
    setting: x.setting === 'indoor' ? 'indoor' : 'garden',
    spot: str(x.spot, 60),
    waterEvery: Math.min(60, Math.max(1, Math.round(Number(x.waterEvery)) || 7)),
    lastWatered: date(x.lastWatered),
    planted: date(x.planted),
    notes: str(x.notes, 2000),
    light: typeof x.light === 'string' && LIGHT[x.light] ? x.light : '',
    history: Array.isArray(x.history) ? x.history.map(date).filter(Boolean).slice(-12) : [],
    created: Number(x.created) || Date.now(),
    updated: Number(x.updated) || 0,
  };
}

function parseBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return { error: 'That file isn’t a Lizzy’s Plants backup. Choose the .json file the app saved.' }; }
  const raw = Array.isArray(data) ? data : Array.isArray(data?.plants) ? data.plants : null;
  if (!raw) return { error: 'That file isn’t a Lizzy’s Plants backup. Choose the .json file the app saved.' };
  const plants = raw.map(cleanPlant).filter(Boolean);
  const plan = data?.plan && typeof data.plan === 'object' ? normalizePlan(data.plan) : null;
  const hasPlan = !!(plan && (plan.state || plan.items.length));
  if (!plants.length && !hasPlan) return { error: 'That backup has no plants in it.' };
  const exported = typeof data?.exported === 'string' ? data.exported.slice(0, 10) : '';
  return { plants, skipped: raw.length - plants.length, exported: date10(exported), plan: hasPlan ? plan : null };
}
const date10 = s => /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';

let backupState = null; // { preview, error, confirmReplace }
function openBackup() {
  backupState = { preview: null, error: '', confirmReplace: false };
  const renderFn = () => {
    const s = backupState;
    const lb = lastBackup();
    const n = Store.plants.length;
    let restore = '';
    if (s.preview) {
      const pv = s.preview;
      const existing = new Map(Store.plants.map(p => [p.id, p]));
      const fresh = pv.plants.filter(p => !existing.has(p.id)).length;
      const same = pv.plants.length - fresh;
      restore = `<div class="card">
        <h3>Backup${pv.exported ? ` from ${esc(fmtDate(pv.exported))}` : ''}: ${plural(pv.plants.length, 'plant')}</h3>
        <p class="small muted">${fresh ? `${plural(fresh, 'new plant')}` : 'No new plants'}${same ? `, ${same} already here` : ''}.${pv.skipped ? ` ${pv.skipped} unreadable entr${pv.skipped === 1 ? 'y was' : 'ies were'} skipped.` : ''}</p>
        ${pv.plan ? `<p class="small muted">Includes a ${pv.plan.year} season plan with ${plural(pv.plan.items.length, 'crop')}.${Plan.data.items.length ? ' “Add” keeps your current plan; “Replace all” uses the one in the backup.' : ''}</p>` : ''}
        ${s.confirmReplace
          ? `<div class="card warn" style="padding:12px"><h3>Replace all ${plural(n, 'plant')}?</h3><p class="small">Plants on this device that aren’t in the backup will be deleted.</p>
             <div class="btn-row"><button class="btn" type="button" data-bk="cancel-replace">Cancel</button><button class="btn danger" type="button" data-bk="replace">Replace</button></div></div>`
          : `<div class="btn-row"><button class="btn primary" type="button" data-bk="merge">Add to my plants</button>${n ? `<button class="btn" type="button" data-bk="ask-replace">Replace all</button>` : ''}</div>
             <p class="small muted">“Add” keeps your current plants and updates any that are also in the backup.</p>`}
      </div>`;
    }
    return `<div><h2>Backup</h2><p class="small muted" style="margin:4px 0 0">Plants are stored in this browser. Save a backup file to keep them safe or to move them to another phone or computer.</p></div>
      <div class="backup-stats">
        <div class="stat"><span class="label">Plants</span><span class="val">${n}</span></div>
        <div class="stat"><span class="label">Last backup</span><span class="val">${lb ? esc(fmtDate(lb)) : 'Never'}</span></div>
      </div>
      <button class="btn primary block" type="button" data-bk="export" ${n || Plan.data.items.length ? '' : 'disabled style="opacity:.5"'}>Save backup file</button>
      <p class="small muted" style="margin:-6px 0 0">On iPhone, choose “Save to Files” and keep it in iCloud Drive.</p>
      <div><h2>Restore</h2><p class="small muted" style="margin:4px 0 0">Load a backup file saved from this app.</p></div>
      ${s.error ? `<div class="card warn"><p class="small">${esc(s.error)}</p></div>` : ''}
      ${restore}
      ${s.preview ? '' : `<button class="btn block" type="button" data-bk="choose">Choose backup file</button>`}`;
  };
  openSheet('Backup & restore', renderFn);
  $('#sheetBody').onclick = async e => {
    const b = e.target.closest('[data-bk]');
    if (!b) return;
    const act = b.dataset.bk;
    if (act === 'export') exportBackup();
    else if (act === 'choose') { const inp = $('#importFile'); inp.value = ''; inp.click(); }
    else if (act === 'ask-replace') { backupState.confirmReplace = true; sheetRefresh(); }
    else if (act === 'cancel-replace') { backupState.confirmReplace = false; sheetRefresh(); }
    else if (act === 'merge' || act === 'replace') {
      const pv = backupState.preview;
      let list = pv.plants;
      if (act === 'merge') {
        const existing = new Map(Store.plants.map(p => [p.id, p]));
        list = list.filter(p => !existing.has(p.id) || (existing.get(p.id).updated || 0) <= p.updated);
      }
      closeSheet();
      const ok = await Store.applyImport(list, act === 'replace');
      if (ok && pv.plan && (act === 'replace' || (!Plan.data.items.length && !Plan.data.state))) Plan.save(pv.plan);
      if (ok) { toast(`Restored ${plural(pv.plants.length, 'plant')}`); tab = 'plants'; filter = 'all'; render(); }
    }
  };
}
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files?.[0];
  if (!file || !backupState) return;
  if (file.size > 5 * 1024 * 1024) { backupState.error = 'That file is too large to be a plant backup.'; backupState.preview = null; }
  else {
    const res = parseBackup(await file.text());
    backupState.error = res.error || '';
    backupState.preview = res.error ? null : res;
    backupState.confirmReplace = false;
  }
  if (sheetRefresh) sheetRefresh();
});

    <p class="small muted">Schedules are starting points. Check the soil with a finger first: hot, windy weeks and small pots need more, rainy weeks and winter need less.</p>`;

function gardenAnalysis() {
  const garden = Store.plants.filter(p => p.setting !== 'indoor' && DB[p.type]);
  const owned = new Set(garden.map(p => p.type));
  const score = new Map();
  owned.forEach(t => REL[t].good.forEach((why, other) => {
    if (owned.has(other) || DB[other].cat === 'house') return;
    if (!score.has(other)) score.set(other, { id: other, helps: new Map(), clashes: [] });
    score.get(other).helps.set(t, why);
  }));
  score.forEach(s => owned.forEach(t => { if (REL[s.id].bad.has(t)) s.clashes.push(t); }));
  const suggestions = [...score.values()]
    .map(s => {
      const helps = [...s.helps.keys()].sort((x, y) => strength(s.id, y) - strength(s.id, x));
      return { ...s, helpsSorted: helps, best: Math.max(...helps.map(t => strength(s.id, t))), score: helps.reduce((n, t) => n + strength(s.id, t), 0) - 2 * s.clashes.length };
    })
    .sort((a, b) => (b.score - a.score) || (b.best - a.best) || DB[a.id].name.localeCompare(DB[b.id].name))
    .slice(0, 8);
  const conflicts = [], friends = [], seen = new Set();
  for (let i = 0; i < garden.length; i++) for (let j = i + 1; j < garden.length; j++) {
    const a = garden[i], b = garden[j];
    if (a.type === b.type || spotKey(a) !== spotKey(b)) continue;
    const key = [a.type, b.type].sort().join('|') + '@' + spotKey(a);
    if (seen.has(key)) continue; seen.add(key);
    if (REL[a.type].bad.has(b.type)) conflicts.push({ a, b, why: REL[a.type].bad.get(b.type) });
    else if (REL[a.type].good.has(b.type)) friends.push({ a, b, why: REL[a.type].good.get(b.type) });
  }
  return { garden, owned, suggestions, conflicts, friends };
}

function viewCompanions() {
  const { garden, suggestions, conflicts, friends } = gardenAnalysis();
  const ownedAll = new Set(Store.plants.map(p => p.type));
  let html = '';

  if (conflicts.length) {
    html += `<section class="section"><p class="eyebrow" style="margin:0">Keep these apart</p>${conflicts.map(c => `
      <div class="card warn"><h3>${esc(displayName(c.a))} and ${esc(displayName(c.b))} share ${esc(spotLabel(c.a))}</h3><p class="small">${esc(c.why)}</p></div>`).join('')}</section>`;
  }

  if (garden.length) {
    html += `<section class="section"><div><h2>Plant next to your garden</h2><p class="small muted" style="margin:4px 0 0">Ranked by how much each one helps the plants in your garden.</p></div>
      ${suggestions.length ? `<div class="rel">${suggestions.map(s => {
        const helps = s.helpsSorted;
        const why = s.helps.get(helps[0]);
        return `<button class="rel-item" type="button" data-lookup="${s.id}">
          ${mono(DB[s.id].name, DB[s.id].cat, 'sm')}
          <span class="row-main"><span class="rel-name">${esc(DB[s.id].name)}${tierTag(s.best)}<span class="tag n">Helps ${helps.length}</span>${s.clashes.length ? `<span class="tag warn">Not near ${esc(s.clashes.map(t => DB[t].name.toLowerCase()).join(', '))}</span>` : ''}</span>
          <span class="rel-why">For your ${esc(helps.map(t => DB[t].name.toLowerCase()).join(', '))}. ${esc(why)}</span></span>
        </button>`;
      }).join('')}</div>` : `<p class="muted small">Your garden already has the classic companions for what you grow.</p>`}</section>`;
  } else {
    html += `<div class="card"><h3>Add garden plants for suggestions</h3><p class="small muted">Once you add plants growing outside, this page suggests companions for them and flags pairs that should be kept apart. You can still look up any plant below.</p></div>`;
  }

  if (friends.length) {
    html += `<section class="section"><p class="eyebrow" style="margin:0">Already working together</p><div class="rel">${friends.map(f => `
      <div class="rel-item"><span class="row-main"><span class="pair">${esc(displayName(f.a))}<span class="amp">+</span>${esc(displayName(f.b))}<span class="tag">${esc(spotLabel(f.a))}</span></span><span class="rel-why">${esc(f.why)}</span></span></div>`).join('')}</div></section>`;
  }

  const q = lookupQuery.trim().toLowerCase();
  const pool = Object.values(DB).filter(d => d.cat !== 'house' && (!q || d.name.toLowerCase().includes(q)))
    .sort((a, b) => (ownedAll.has(b.id) - ownedAll.has(a.id)) || a.name.localeCompare(b.name));
  html += `<section class="section"><div><h2>Look up a plant</h2><p class="small muted" style="margin:4px 0 0">See what grows well with it and what to keep away. Plants you have are outlined.</p></div>
    <div class="search">${ICON.search}<input class="input" id="lookupSearch" type="search" placeholder="Search tomato, basil, beans…" value="${esc(lookupQuery)}" autocomplete="off"></div>
    <div class="grid-chips" id="lookupChips">${pool.map(d => `<button type="button" data-lookup="${d.id}" class="${ownedAll.has(d.id) ? 'owned' : ''}">${esc(d.name)}</button>`).join('') || '<span class="muted small">No match. Try another name.</span>'}</div>
  </section>`;
  return html;
}

/* Companion blocks reused by detail + lookup */
function companionBlocks(typeId, plant) {
  const d = DB[typeId];
  if (!d) return '';
  const ownedAll = new Set(Store.plants.map(p => p.type));
  if (d.cat === 'house') {
    const similar = Object.values(DB).filter(o => o.cat === 'house' && o.id !== d.id &&
      Math.abs(LIGHT[o.light].lvl - LIGHT[d.light].lvl) <= 1 && Math.abs(o.water - d.water) <= 3);
    if (!similar.length) return '';
    return `<section class="section"><div><h2>Groups well with</h2><p class="small muted" style="margin:4px 0 0">Houseplants with the same light and watering rhythm. Clustering them raises humidity and puts them on one schedule.</p></div>
      <div class="rel">${similar.map(o => `<div class="rel-item">${mono(o.name, o.cat, 'sm')}<span class="row-main"><span class="rel-name">${esc(o.name)}${ownedAll.has(o.id) ? '<span class="tag here">You have this</span>' : ''}</span><span class="rel-why">${esc(LIGHT[o.light].label)} · water about every ${o.water} days</span></span></div>`).join('')}</div></section>`;
  }
  const sameSpot = other => plant && plant.setting !== 'indoor' && Store.plants.some(p => p.id !== plant.id && p.type === other && p.setting !== 'indoor' && spotKey(p) === spotKey(plant));
  const byRank = (a, b) => (sameSpot(b[0]) - sameSpot(a[0])) || (ownedAll.has(b[0]) - ownedAll.has(a[0]))
    || (CAT_ORDER[DB[a[0]].cat] - CAT_ORDER[DB[b[0]].cat]) || DB[a[0]].name.localeCompare(DB[b[0]].name);
  const good = [...REL[typeId].good.entries()].sort((a, b) => (strength(typeId, b[0]) - strength(typeId, a[0])) || byRank(a, b));
  const bad = [...REL[typeId].bad.entries()].sort(byRank);
  const legendCats = Object.keys(CAT_ORDER).filter(c => [...good, ...bad].some(([o]) => DB[o].cat === c));
  const legend = legendCats.length > 1 ? `<div class="legend" aria-label="Icon colors show plant type">${legendCats.map(c => `<span><i style="--c: var(--c-${c})"></i>${CAT_PLURAL[c]}</span>`).join('')}</div>` : '';
  let html = '';
  html += `<section class="section"><div><h2>Good neighbors</h2>${good.length ? `<p class="small muted" style="margin:4px 0 8px">Best companions first.</p>
      <div class="tiers"><div>${tierTag(3)}<span>Strong, well-known benefit</span></div><div>${tierTag(2)}<span>A useful boost</span></div><div>${tierTag(1)}<span>Traditional pairing, little proof</span></div></div>
      <p class="small muted" style="margin:10px 0 6px">Icon color shows the plant type.</p>${legend}` : ''}</div>${good.length ? `<div class="rel">${good.map(([o, why]) => `
    <button class="rel-item" type="button" data-lookup="${o}">${mono(DB[o].name, DB[o].cat, 'sm')}<span class="row-main"><span class="rel-name">${esc(DB[o].name)}${tierTag(strength(typeId, o))}${sameSpot(o) ? '<span class="tag here">Same spot</span>' : ownedAll.has(o) ? '<span class="tag here">You have this</span>' : ''}</span><span class="rel-why">${esc(why)}</span></span></button>`).join('')}</div>`
    : `<p class="small muted">No well-known companions. It’s fine next to most plants.</p>`}</section>`;
  if (bad.length) html += `<section class="section"><h2>Keep apart</h2><div class="rel bad">${bad.map(([o, why]) => `
    <button class="rel-item" type="button" data-lookup="${o}">${mono(DB[o].name, DB[o].cat, 'sm')}<span class="row-main"><span class="rel-name">${esc(DB[o].name)}${sameSpot(o) ? '<span class="tag warn">Same spot now</span>' : ''}</span><span class="rel-why">${esc(why)}</span></span></button>`).join('')}</div></section>`;
  return html;
}

function careStats(lightKey, every, extra = {}) {
  const l = LIGHT[lightKey];
  const waterLvl = every <= 2 ? 5 : every <= 3 ? 4 : every <= 6 ? 3 : every <= 10 ? 2 : 1;
  return `<div class="care">
    ${l ? `<div class="stat"><span class="label">Light</span><span class="val">${esc(l.label)}</span>${meter(l.lvl, 'sun')}<span class="hint">${esc(l.hint)}</span></div>` : ''}
    <div class="stat"><span class="label">Water</span><span class="val">Every ${plural(every, 'day')}</span>${meter(waterLvl, 'drop')}<span class="hint">${waterLvl >= 4 ? 'Thirsty: keep soil evenly moist' : waterLvl === 3 ? 'When the top inch is dry' : 'Let soil dry out between drinks'}</span></div>
    ${extra.next ? `<div class="stat"><span class="label">Next water</span><span class="val">${esc(extra.next)}</span><span class="hint">${esc(extra.last)}</span></div>` : ''}
    ${extra.planted ? `<div class="stat"><span class="label">Planted</span><span class="val">${esc(extra.planted)}</span><span class="hint">${esc(extra.age)}</span></div>` : ''}
  </div>`;
}

let sheetRefresh = null;
function openSheet(title, renderFn) {
  $('#sheetTitle').textContent = title;
  const body = $('#sheetBody');
  body.onclick = body.oninput = body.onchange = body.onsubmit = null;
  sheetRefresh = () => { const st = body.scrollTop; body.innerHTML = renderFn(); body.scrollTop = st; };
  body.innerHTML = renderFn();
  body.scrollTop = 0;
  $('#sheetRoot').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('#sheetRoot').hidden = true;
  sheetRefresh = null;
  document.body.style.overflow = '';
}

function openDetail(id) {
  let confirmDelete = false;
  const renderFn = () => {
    const p = Store.get(id);
    if (!p) { setTimeout(closeSheet); return ''; }
    const d = typeOf(p);
    const w = waterInfo(p);
    const next = w.never ? 'Today' : w.left < 0 ? `${-w.left}d overdue` : w.left === 0 ? 'Today' : w.left === 1 ? 'Tomorrow' : `In ${w.left} days`;
    const age = p.planted ? daysBetween(p.planted, todayISO()) : null;
    const history = (p.history || []).slice(-6).reverse();
    return `<div class="hero">${mono(displayName(p), catOf(p), 'lg')}<div class="hero-text"><h2>${esc(displayName(p))}</h2><p class="muted small" style="margin:2px 0 0">${esc(typeName(p))} · ${esc(spotLabel(p))}${p.setting === 'indoor' ? '' : ' (outside)'}</p></div></div>
      ${!Store.readOnly ? `<div class="btn-row">
        ${w.left <= 0 ? `<button class="btn water" type="button" data-water="${esc(p.id)}">${ICON.drop}Mark watered</button>` : `<button class="btn" type="button" data-water="${esc(p.id)}">${ICON.drop}Watered today</button>`}
        <button class="btn" type="button" data-edit="${esc(p.id)}">${ICON.edit}Edit</button>
      </div>` : ''}
      ${careStats(p.light || d?.light, w.every, {
        next, last: p.lastWatered ? `Last: ${fmtDate(p.lastWatered)}` : 'No watering logged yet',
        planted: p.planted ? fmtDate(p.planted) : '', age: age != null ? (age < 1 ? 'Today' : age < 60 ? `${plural(age, 'day')} ago` : `About ${Math.round(age / 30)} months ago`) : '',
      })}
      ${d?.note ? `<div class="note"><b>Care tip</b>${esc(d.note)}${p.setting === 'indoor' && d.cat !== 'house' ? ' In a pot it dries out faster, so check it more often.' : ''}</div>` : ''}
      ${p.notes ? `<div class="note"><b>Your notes</b>${esc(p.notes).replace(/\n/g, '<br>')}</div>` : ''}
      ${history.length ? `<div class="note"><b>Recent waterings</b>${history.map(fmtDate).join(' · ')}</div>` : ''}
      ${d ? companionBlocks(d.id, p) : ''}
      ${!Store.readOnly ? (confirmDelete
        ? `<div class="card warn"><h3>Remove ${esc(displayName(p))}?</h3><p class="small">This deletes the plant and its watering history.</p><div class="btn-row"><button class="btn" type="button" data-cancel-del>Keep it</button><button class="btn danger" type="button" data-confirm-del="${esc(p.id)}">Remove</button></div></div>`
        : `<button class="btn ghost" type="button" data-ask-del style="color:var(--warn);justify-self:start">Remove plant</button>`) : ''}`;
  };
  openSheet('Plant', renderFn);
  $('#sheetBody').onclick = e => {
    if (e.target.closest('[data-ask-del]')) { confirmDelete = true; sheetRefresh(); }
    if (e.target.closest('[data-cancel-del]')) { confirmDelete = false; sheetRefresh(); }
  };
}

function openLookup(typeId) {
  const renderFn = () => {
    const d = DB[typeId];
    const mine = Store.plants.filter(p => p.type === typeId);
    return `<div class="hero">${mono(d.name, d.cat, 'lg')}<div class="hero-text"><h2>${esc(d.name)}</h2><p class="muted small" style="margin:2px 0 0">${esc(CATS[d.cat])}${mine.length ? ` · you have ${mine.length}` : ''}</p></div></div>
      ${careStats(d.light, d.water)}
      <div class="note"><b>Care tip</b>${esc(d.note)}</div>
      ${!Store.readOnly ? `<button class="btn primary block" type="button" data-quick="${d.id}">Add ${esc(d.name.toLowerCase())} to my plants</button>` : ''}
      ${companionBlocks(typeId, null)}`;
  };
  openSheet('Companion guide', renderFn);
  $('#sheetBody').onclick = null;
}

function openForm(id, presetType) {
  const existing = id ? Store.get(id) : null;
  const preset = DB[presetType];
  const f = existing ? { ...existing } : {
    id: newId(), type: preset ? preset.id : '', name: '', customType: '',
    setting: preset?.cat === 'house' ? 'indoor' : 'garden', spot: '',
    waterEvery: preset ? preset.water : 7, lastWatered: todayISO(), planted: '', notes: '', light: '', history: [],
  };
  let query = '';
  let picking = !f.type && !f.customType;
  const spots = () => {
    const indoor = f.setting === 'indoor';
    const used = Store.plants.filter(p => (p.setting === 'indoor') === indoor).map(p => (p.spot || '').trim()).filter(Boolean);
    const seen = new Set();
    return [...SPOT_PRESETS[indoor ? 'indoor' : 'garden'], ...used].filter(s => { const k = s.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
  };

  const renderFn = () => {
    const d = DB[f.type];
    let typeBlock;
    if (picking) {
      const q = query.trim().toLowerCase();
      const matches = Object.values(DB).filter(x => !q || x.name.toLowerCase().includes(q) || CATS[x.cat].toLowerCase().includes(q))
        .sort((a, b) => a.name.localeCompare(b.name));
      typeBlock = `<div class="field"><label for="f-q">What is it?</label>
        <div class="search">${ICON.search}<input class="input" id="f-q" type="search" placeholder="Search 55 plants…" value="${esc(query)}" autocomplete="off"></div>
        <div class="picker" id="f-picker">${matches.map(x => `<button class="pick" type="button" data-pick="${x.id}">${mono(x.name, x.cat, 'sm')}<span class="row-main"><span class="row-title">${esc(x.name)}</span><span class="row-sub">${esc(CATS[x.cat])} · ${esc(LIGHT[x.light].label)}</span></span></button>`).join('')}
        ${q ? `<button class="pick" type="button" data-custom>${mono(query, 'other', 'sm')}<span class="row-main"><span class="row-title">Use “${esc(query.trim())}”</span><span class="row-sub">Custom plant, set care yourself</span></span></button>` : ''}</div></div>`;
    } else {
      const nm = d ? d.name : f.customType;
      typeBlock = `<div class="field"><span class="label">Plant</span><div class="chosen">${mono(nm, d?.cat || 'other', 'sm')}<span class="row-main" style="flex:1"><span class="row-title">${esc(nm)}</span><span class="row-sub">${esc(d ? CATS[d.cat] : 'Custom plant')}</span></span><button class="btn ghost" type="button" data-repick>Change</button></div></div>`;
    }
    const spotList = spots();
    return `<form id="plantForm" novalidate style="display:grid;gap:16px">
      ${typeBlock}
      ${picking ? '' : `
      <div class="field"><label for="f-name">Nickname <span class="muted">(optional)</span></label><input class="input" id="f-name" value="${esc(f.name)}" placeholder="e.g. ${esc(d ? d.name : f.customType)} by the fence" autocomplete="off"></div>
      <div class="field"><span class="label">Where</span><div class="seg" role="group"><button type="button" data-setting="garden" aria-pressed="${f.setting !== 'indoor'}">Garden / outside</button><button type="button" data-setting="indoor" aria-pressed="${f.setting === 'indoor'}">Indoors</button></div></div>
      <div class="field"><label for="f-spot">Spot <span class="muted">(tap one or type a new one)</span></label><input class="input" id="f-spot" value="${esc(f.spot)}" placeholder="${f.setting === 'indoor' ? 'e.g. Bedroom' : 'e.g. Garden bed 3'}" autocomplete="off">
        ${spotList.length ? `<div class="spots">${spotList.map(s => `<button type="button" data-spot="${esc(s)}" aria-pressed="${s.toLowerCase() === (f.spot || '').trim().toLowerCase()}">${esc(s)}</button>`).join('')}</div>` : ''}
        ${f.setting !== 'indoor' ? `<span class="small muted">Plants with the same spot are checked against each other for companions and conflicts.</span>` : ''}</div>
      ${!d ? `<div class="field"><label for="f-light">Light</label><select class="input" id="f-light">${Object.entries(LIGHT).map(([k, v]) => `<option value="${k}" ${f.light === k ? 'selected' : ''}>${v.label}: ${v.hint}</option>`).join('')}</select></div>` : ''}
      <div class="field"><span class="label">Water every</span><div class="stepper"><button type="button" data-step="-1" aria-label="Fewer days">−</button><output id="f-every">${plural(f.waterEvery, 'day')}</output><button type="button" data-step="1" aria-label="More days">+</button></div>
        ${d ? `<span class="small muted">Suggested for ${esc(d.name.toLowerCase())}: every ${plural(d.water, 'day')}${f.setting === 'indoor' && d.cat !== 'house' ? '. Pots dry faster, so consider less.' : '.'}</span>` : ''}</div>
      <div class="two">
        <div class="field"><label for="f-last">Last watered</label><input class="input" id="f-last" type="date" value="${esc(f.lastWatered || '')}" max="${todayISO()}"></div>
        <div class="field"><label for="f-planted">Planted</label><input class="input" id="f-planted" type="date" value="${esc(f.planted || '')}" max="${todayISO()}"></div>
      </div>
      <div class="field"><label for="f-notes">Notes</label><textarea class="input" id="f-notes" placeholder="Variety, where you bought it, feeding schedule…">${esc(f.notes)}</textarea></div>
      <button class="btn primary block" type="submit">${existing ? 'Save changes' : 'Add plant'}</button>`}
    </form>`;
  };

  const syncInputs = () => {
    const v = s => $(s) ? $(s).value : undefined;
    if ($('#f-name')) f.name = v('#f-name');
    if ($('#f-spot')) f.spot = v('#f-spot');
    if ($('#f-light')) f.light = v('#f-light');
    if ($('#f-last')) f.lastWatered = v('#f-last');
    if ($('#f-planted')) f.planted = v('#f-planted');
    if ($('#f-notes')) f.notes = v('#f-notes');
  };

  openSheet(existing ? 'Edit plant' : 'Add plant', renderFn);
  const baseRefresh = sheetRefresh;
  sheetRefresh = () => { syncInputs(); baseRefresh(); };
  const body = $('#sheetBody');
  body.onclick = e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.pick) {
      const d = DB[t.dataset.pick];
      f.type = d.id; f.customType = ''; f.light = '';
      if (!existing) { f.waterEvery = d.water; f.setting = d.cat === 'house' ? 'indoor' : 'garden'; }
      picking = false; sheetRefresh(); body.scrollTop = 0;
    } else if ('custom' in t.dataset) {
      f.type = ''; f.customType = query.trim(); f.light = f.light || 'bright'; picking = false; sheetRefresh();
    } else if ('repick' in t.dataset) {
      syncInputs(); picking = true; query = ''; sheetRefresh();
      setTimeout(() => $('#f-q')?.focus(), 50);
    } else if (t.dataset.setting) {
      syncInputs();
      const other = SPOT_PRESETS[t.dataset.setting === 'indoor' ? 'garden' : 'indoor'].map(s => s.toLowerCase());
      if (other.includes((f.spot || '').trim().toLowerCase())) f.spot = '';
      f.setting = t.dataset.setting; baseRefresh();
    } else if (t.dataset.spot) {
      syncInputs(); f.spot = t.dataset.spot; baseRefresh();
    } else if (t.dataset.step) {
      f.waterEvery = Math.min(60, Math.max(1, Number(f.waterEvery) + Number(t.dataset.step)));
      $('#f-every').textContent = plural(f.waterEvery, 'day');
    }
  };
  body.oninput = e => {
    if (e.target.id === 'f-spot') {
      const v = e.target.value.trim().toLowerCase();
      body.querySelectorAll('[data-spot]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.spot.toLowerCase() === v)));
    }
    if (e.target.id === 'f-q') {
      query = e.target.value;
      const pos = e.target.selectionStart;
      sheetRefresh();
      const inp = $('#f-q'); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (_) {}
    }
  };
  body.onsubmit = async e => {
    e.preventDefault();
    syncInputs();
    if (!f.type && !f.customType) return;
    const rec = {
      id: f.id, type: f.type || '', customType: f.customType || '', name: (f.name || '').trim(),
      setting: f.setting, spot: (f.spot || '').trim(), waterEvery: Number(f.waterEvery),
      lastWatered: f.lastWatered || '', planted: f.planted || '', notes: (f.notes || '').trim(),
      light: f.type ? '' : (f.light || 'bright'), history: f.history || [], created: f.created || Date.now(),
    };
    if (!existing && rec.lastWatered && !rec.history.includes(rec.lastWatered)) rec.history = [rec.lastWatered];
    closeSheet();
    const ok = await Store.save(rec);
    if (ok) toast(existing ? 'Saved' : `Added ${displayName(rec)}`);
    if (!existing) { tab = 'plants'; render(); }
  };
}

/* Growing data for outdoor plants.
   sq: square feet per plant (spacing = sqrt(sq) × 12 in.)
   m: transplant (start indoors) | direct (sow in place) | either | buy (buy a starter) | perennial | fall (plant in autumn)
   in: [earliest, latest] weeks BEFORE last frost to start seeds indoors
   out: weeks relative to last frost to plant out or sow (negative = before)
   dtm: days to first harvest from planting out or sowing; hw: weeks of harvest
   tender: killed by frost; cool: cool-season crop (fall crop possible); succ: re-sow every N weeks */
const GROW = {
  tomato:     { sq: 4,      m: 'transplant', in: [8, 6],   out: 2,  dtm: 70, hw: 10, tender: 1 },
  pepper:     { sq: 1.5,    m: 'transplant', in: [10, 8],  out: 2,  dtm: 70, hw: 10, tender: 1 },

const PLAN_KEY = 'lizzys-plants-plan-v1';
const DEFAULT_BED = { l: 8, w: 4 };
const clone = o => JSON.parse(JSON.stringify(o));

function defaultPlan() {
  const now = new Date();
  return {
    state: '', year: now.getMonth() >= 6 ? now.getFullYear() + 1 : now.getFullYear(), lf: '', ff: '',
    beds: Object.fromEntries(SPOT_PRESETS.garden.map(b => [b, { ...DEFAULT_BED }])), items: [], done: {},
  };
}
function normalizePlan(x) {
  const d = defaultPlan();
  if (!x || typeof x !== 'object') return d;
  const mm = v => typeof v === 'string' && /^\d{2}-\d{2}$/.test(v) ? v : '';
  const num = (v, lo, hi, def) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def; };
  const beds = {};
  if (x.beds && typeof x.beds === 'object') Object.entries(x.beds).slice(0, 30).forEach(([k, v]) => {
    const name = String(k).slice(0, 60).trim();
    if (name) beds[name] = { l: num(v?.l, 1, 200, 8), w: num(v?.w, 1, 200, 4) };
  });
  const items = Array.isArray(x.items) ? x.items.slice(0, 200).map(it => it && GROW[it.type] ? {
    id: typeof it.id === 'string' && /^[A-Za-z0-9_-]{1,60}$/.test(it.id) ? it.id : newId(),
    type: it.type,
    qty: Math.round(num(it.qty, 1, 500, 1)),
    bed: typeof it.bed === 'string' ? it.bed.slice(0, 60).trim() : '',
    dtm: it.dtm ? Math.round(num(it.dtm, 1, 400, 0)) : 0,
    notes: typeof it.notes === 'string' ? it.notes.slice(0, 500) : '',
  } : null).filter(Boolean) : [];
  items.forEach(it => { if (it.bed && !beds[it.bed]) beds[it.bed] = { ...DEFAULT_BED }; });
  const done = {};
  if (x.done && typeof x.done === 'object') Object.keys(x.done).slice(0, 2000).forEach(k => { if (x.done[k] === true && k.length < 100) done[k] = true; });
  return {
    state: STATES[x.state] ? x.state : '', year: Math.round(num(x.year, 2000, 2100, d.year)),
    lf: mm(x.lf), ff: mm(x.ff), beds: Object.keys(beds).length ? beds : d.beds, items, done,
  };
}

const Plan = {
  data: defaultPlan(), doc: null, chain: Promise.resolve(),
  init(db) {
    if (db) {
      this.doc = db.doc('planner/main');
      this.doc.onSnapshot(s => { if (s.exists) { this.data = normalizePlan(s.data()); render(); } }, () => {});
    } else {
      try { const raw = localStorage.getItem(PLAN_KEY); if (raw) this.data = normalizePlan(JSON.parse(raw)); } catch (e) {}
    }
  },
  save(next) {
    this.data = normalizePlan(next);
    render();
    if (this.doc) {
      const snap = clone(this.data);
      this.chain = this.chain.then(() => this.doc.set(snap)).catch(e => Store.handleWriteError(e));
    } else {
      try { localStorage.setItem(PLAN_KEY, JSON.stringify(this.data)); } catch (e) {}
    }
  },
};

/* Dates */
const mmddDate = (s, y) => { const [m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dt, n) => { const r = new Date(dt); r.setDate(r.getDate() + n); return r; };
const isoOf = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
const today0 = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const dayDiff = (a, b) => Math.round((b - a) / 864e5);
function fmtD(dt, year) {
  const opts = { month: 'short', day: 'numeric' };
  if (year && dt.getFullYear() !== year) opts.year = 'numeric';
  return dt.toLocaleDateString(undefined, opts);
}

function seasonInfo(plan = Plan.data) {
  const st = STATES[plan.state];
  if (!st) return null;
  const year = plan.year;
  const lf = mmddDate(plan.lf || st[1], year), ff = mmddDate(plan.ff || st[2], year);
  return { year, lf, ff, days: dayDiff(lf, ff), name: st[0], code: plan.state, custom: !!(plan.lf || plan.ff), frostFree: plan.state === 'HI' };
}

const harvestVerb = type => DB[type].cat === 'flower' ? 'Blooms' : DB[type].cat === 'herb' ? 'Pick' : 'Harvest';
const spacingIn = g => Math.max(2, Math.round(Math.sqrt(g.sq) * 12));
const fmtSq = n => n >= 10 ? Math.round(n) : Math.round(n * 10) / 10;

function schedule(item, s) {
  const g = GROW[item.type];
  if (!g) return null;
  const dtm = Number(item.dtm) || g.dtm;
  const r = { g, dtm, warnings: [] };
  const t0 = today0();
  if (g.m === 'fall') {
    r.plantOut = addDays(s.ff, 10);
    r.harvestText = 'Next summer, when the lower leaves brown';
    return r;
  }
  r.plantOut = addDays(s.lf, g.out * 7);
  if (g.in) { r.startFrom = addDays(s.lf, -g.in[0] * 7); r.startTo = addDays(s.lf, -g.in[1] * 7); }
  if (g.m === 'perennial') { r.harvestText = g.harvestNote; return r; }
  r.harvestStart = addDays(r.plantOut, dtm);
  let end = addDays(r.harvestStart, Math.max(1, g.hw) * 7);
  if (g.tender && end > s.ff && !s.frostFree) end = s.ff;
  r.harvestEnd = end;
  if (g.tender && !s.frostFree) {
    if (r.harvestStart >= s.ff) r.warnings.push(`Needs about ${dtm} days after planting, but frost usually arrives ${fmtD(s.ff)}. Pick a faster variety.`);
    else if (dayDiff(r.harvestStart, s.ff) < 21) r.warnings.push(`Only about ${dayDiff(r.harvestStart, s.ff)} days of harvest before frost. A faster variety gives you more.`);
  }
  if (r.startTo && r.startTo < t0 && r.plantOut > t0) {
    r.warnings.push(g.m === 'either' ? 'Too late to start indoors. Sow it outside on the planting date instead.' : 'Too late to start seeds indoors. Buy starter plants instead.');
  }
  if (g.cool && !s.frostFree) {
    const fall = addDays(s.ff, -(dtm + 14));
    if (fall > addDays(r.harvestEnd, 14)) r.fallSow = fall;
  }
  return r;
}

function plantName(it) { return `${DB[it.type].name}${it.qty > 1 ? ` ×${it.qty}` : ''}`; }

function planTasks(s, plan = Plan.data) {
  const tasks = [];
  plan.items.forEach(it => {
    const r = schedule(it, s);
    if (!r) return;
    const g = r.g, name = plantName(it), where = it.bed ? ` in ${it.bed}` : '';
    const add = (kind, date, text, sub) => tasks.push({ key: `${it.id}:${kind}`, kind, date, text, sub, itemId: it.id });
    if (r.startFrom) add('start', r.startFrom,
      g.m === 'either' ? `Start ${name} indoors (optional)` : `Start ${name} seeds indoors`,
      `Any time until ${fmtD(r.startTo, s.year)}. Sow under lights or in a sunny window.`);
    if (g.m === 'transplant') add('harden', addDays(r.plantOut, -10), `Harden off ${name} seedlings`, 'Put them outside a few hours a day, a little longer each day.');
    const plantText = {
      transplant: [`Plant ${name}${where}`, `Space about ${spacingIn(g)} in. apart.`],
      direct: [`Sow ${name}${where}`, `Thin to about ${spacingIn(g)} in. apart.`],
      either: [`Plant or sow ${name}${where}`, `Space about ${spacingIn(g)} in. apart.`],
      buy: [`Plant ${name}${where}`, `Buy starter plants. Space about ${spacingIn(g)} in. apart.`],
      perennial: [`Plant ${name}${where}`, `Plant crowns or bare-root plants about ${spacingIn(g)} in. apart.`],
      fall: [`Plant ${name} cloves${where}`, 'Pointy end up, 2 in. deep. Mulch well for winter.'],
    }[g.m];
    let sub = plantText[1];
    if (g.succ) sub += ` Sow more every ${g.succ} weeks for a steady supply.`;
    add('plant', r.plantOut, plantText[0], sub);
    if (r.harvestStart) {
      const verb = harvestVerb(it.type);
      add('harvest', r.harvestStart, verb === 'Blooms' ? `${DB[it.type].name} starts blooming` : `${verb} ${DB[it.type].name}`,
        `About ${r.dtm} days after planting. Expect it through ${fmtD(r.harvestEnd, s.year)}.`);
    }
    if (r.fallSow) add('fall', r.fallSow, `Sow a fall crop of ${DB[it.type].name}`, 'Cool-season crops taste sweeter after light frost.');
  });
  return tasks.sort((a, b) => a.date - b.date);
}

function bedUsage(plan = Plan.data) {
  const out = new Map();
  Object.entries(plan.beds).forEach(([name, b]) => out.set(name, { name, area: b.l * b.w, l: b.l, w: b.w, used: 0, items: [] }));
  plan.items.forEach(it => {
    const key = it.bed || Object.keys(plan.beds)[0];
    if (!out.has(key)) out.set(key, { name: key, area: 32, l: 8, w: 4, used: 0, items: [] });
    const b = out.get(key);
    b.used += GROW[it.type].sq * it.qty;
    b.items.push(it);
  });
  return [...out.values()];
}

function taskRow(t, s, done, t0) {
  const late = !done && t.date < t0;
  return `<div class="task ${done ? 'done' : ''}">
    <button class="tick" type="button" data-task="${esc(t.key)}" aria-pressed="${done}" aria-label="${done ? 'Mark not done' : 'Mark done'}: ${esc(t.text)}">${ICON.check}</button>
    <div class="row-main"><span class="task-text">${esc(t.text)}</span><span class="row-sub" style="white-space:normal">${esc(fmtD(t.date, s.year))} · ${esc(t.sub)}</span></div>
    ${late ? '<span class="pill late">Late</span>' : ''}
  </div>`;
}

function viewPlanner() {
  const plan = Plan.data, s = seasonInfo(plan);
  if (!s) {
    return `<section class="empty"><h2>Plan your outdoor season</h2>
      <p>Pick your state to estimate frost dates. Then add what you want to grow. The planner works out when to start seeds indoors, when to plant out, how much bed space each crop needs, and when to expect a harvest.</p>
      ${Store.readOnly ? '' : '<button class="btn primary" type="button" data-season>Set up my season</button>'}</section>`;
  }
  const t0 = today0();
  const tasks = planTasks(s, plan);
  const frostNote = s.frostFree ? 'Frost-free year round in most of the state' : `${s.days} frost-free days · ${s.custom ? 'your dates' : 'state average'}`;
  let html = `<section class="card season">
    <div class="season-top"><div><p class="eyebrow" style="margin:0 0 2px">${s.year} season · ${esc(s.name)}</p>
      <h2>${esc(fmtD(s.lf))} to ${esc(fmtD(s.ff))}</h2>
      <p class="small muted" style="margin:2px 0 0">Last spring frost to first fall frost. ${esc(frostNote)}.</p></div>
      ${Store.readOnly ? '' : '<button class="btn ghost" type="button" data-season style="min-height:0;padding:4px 0">Change</button>'}</div>
  </section>`;

  if (!plan.items.length) {
    const quick = ['tomato', 'pepper', 'lettuce', 'carrot', 'bean', 'cucumber', 'squash', 'basil', 'marigold'];
    return html + `<section class="empty"><h2>What do you want to grow?</h2>
      <p>Add crops and how many plants you want. You’ll get seed-starting dates, planting dates, harvest estimates, and a check on whether they fit your beds.</p>
      <div class="quick">${quick.map(id => `<button type="button" data-plan-add="${id}">+ ${esc(DB[id].name)}</button>`).join('')}</div></section>`;
  }

  const upcoming = tasks.filter(t => !plan.done[t.key] && t.date >= addDays(t0, -30)).slice(0, 4);
  html += `<section class="section"><p class="eyebrow" style="margin:0">Up next</p>
    ${upcoming.length ? `<div class="list">${upcoming.map(t => taskRow(t, s, false, t0)).join('')}</div>` : '<p class="small muted">Nothing left to do this season. Nice work.</p>'}</section>`;

  html += `<section class="section"><div><h2>Beds</h2><p class="small muted" style="margin:4px 0 0">Space each crop needs, and companions to consider.</p></div>`;
  bedUsage(plan).forEach(b => {
    const pct = Math.min(100, b.area ? (b.used / b.area) * 100 : 100);
    const over = b.used > b.area;
    const free = b.area - b.used;
    const types = [...new Set(b.items.map(i => i.type))];
    const clashes = [];
    for (let i = 0; i < types.length; i++) for (let j = i + 1; j < types.length; j++) {
      const why = REL[types[i]]?.bad.get(types[j]);
      if (why) clashes.push(`${DB[types[i]].name} and ${DB[types[j]].name}: ${why}`);
    }
    const tips = [];
    types.forEach(t => REL[t]?.good.forEach((why, o) => {
      if (strength(t, o) === 3 && !types.includes(o) && GROW[o] && !types.some(x => REL[x]?.bad.has(o)) && !tips.some(x => x.o === o)) tips.push({ o, t });
    }));
    html += `<div class="card">
      <div class="bed-head"><h3>${esc(b.name)}</h3><span class="small muted">${b.l} × ${b.w} ft</span></div>
      <div class="bar ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div>
      <p class="small ${over ? '' : 'muted'}" style="${over ? 'color:var(--warn)' : ''}">${fmtSq(b.used)} of ${fmtSq(b.area)} sq ft planned. ${over ? `Over by ${fmtSq(-free)} sq ft. Move a crop, plant fewer, or grow vines up a trellis.` : b.items.length ? `${fmtSq(free)} sq ft free.` : 'Empty.'}</p>
      ${b.items.map(it => {
        const r = schedule(it, s), g = r.g;
        const verb = harvestVerb(it.type);
        const parts = [];
        if (r.startFrom) parts.push(`Indoors <b>${esc(fmtD(r.startFrom, s.year))}</b>`);
        parts.push(`${g.m === 'direct' ? 'Sow' : 'Plant'} <b>${esc(fmtD(r.plantOut, s.year))}</b>`);
        if (r.harvestStart) parts.push(`${verb} <b>${esc(fmtD(r.harvestStart, s.year))}–${esc(fmtD(r.harvestEnd, s.year))}</b>`);
        else if (r.harvestText) parts.push(esc(r.harvestText));
        return `<button class="plan-item" type="button" data-plan-item="${esc(it.id)}">
          ${mono(DB[it.type].name, DB[it.type].cat, 'sm')}
          <span class="row-main"><span class="row-title">${esc(plantName(it))}</span>
            <span class="dates">${parts.map(p => `<span>${p}</span>`).join('')}</span>
            ${r.warnings.map(w => `<span class="warnline">${esc(w)}</span>`).join('')}</span>
          <span class="sqft">${fmtSq(g.sq * it.qty)} sq ft</span>
        </button>`;
      }).join('')}
      ${clashes.map(c => `<p class="warnline">Keep apart. ${esc(c)}</p>`).join('')}
      ${tips.length && !Store.readOnly ? `<div class="tips"><span>Top pick companions:</span>${tips.slice(0, 3).map(x => `<button class="tip-btn" type="button" data-plan-add="${x.o}" data-bed="${esc(b.name)}">+ ${esc(DB[x.o].name)}</button>`).join('')}</div>` : ''}
      ${!b.items.length && !Store.readOnly ? `<button class="tip-btn" type="button" data-plan-add="" data-bed="${esc(b.name)}" style="justify-self:start">+ Add a crop</button>` : ''}
    </div>`;
  });
  html += `</section>`;

  const months = new Map();
  tasks.forEach(t => {
    const k = t.date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    if (!months.has(k)) months.set(k, []);
    months.get(k).push(t);
  });
  html += `<section class="section"><div><h2>Season calendar</h2><p class="small muted" style="margin:4px 0 0">Every step, in order. Tick them off as you go.</p></div>
    ${[...months.entries()].map(([m, ts]) => `<p class="month">${esc(m)}</p><div class="list">${ts.map(t => taskRow(t, s, !!plan.done[t.key], t0)).join('')}</div>`).join('')}
    <p class="small muted">Dates are estimates from average frost dates. Watch your local forecast before planting tender crops, and check seed packets for days to harvest.</p></section>`;
  return html;
}

function toggleTask(key) {
  if (Store.readOnly) return;
  const p = clone(Plan.data);
  if (p.done[key]) delete p.done[key]; else p.done[key] = true;
  Plan.save(p);
}

/* Season setup sheet */

  const d = clone(Plan.data);
  const thisYear = new Date().getFullYear();
  let newBedName = '';
  const renderFn = () => {
    const st = STATES[d.state];
    const used = new Set(d.items.map(i => i.bed));
    const lfVal = st ? isoOf(mmddDate(d.lf || st[1], d.year)) : '';
    const ffVal = st ? isoOf(mmddDate(d.ff || st[2], d.year)) : '';
    return `<div class="field"><label for="s-state">State</label>
