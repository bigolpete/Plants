        </div>
        <p class="small muted" style="margin:-6px 0 0">Typical for ${esc(st[0])}: ${esc(fmtD(mmddDate(st[1], d.year)))} and ${esc(fmtD(mmddDate(st[2], d.year)))}. Your town can be weeks different, so search “frost dates” with your ZIP code and adjust.${d.lf || d.ff ? ` <button class="btn ghost" type="button" data-ss="reset" style="min-height:0;padding:0">Use state average</button>` : ''}</p>` : ''}
      <div><h2>Beds</h2><p class="small muted" style="margin:4px 0 0">Length × width in feet. Used to check that your crops fit.</p></div>
      <div style="display:grid;gap:8px">${Object.entries(d.beds).map(([name, b]) => `<div class="bedrow">
          <span class="row-title">${esc(name)}</span>
          <input class="input" type="number" inputmode="decimal" min="1" max="200" step="0.5" value="${b.l}" data-bed-l="${esc(name)}" aria-label="${esc(name)} length in feet">
          <span class="x">×</span>
          <input class="input" type="number" inputmode="decimal" min="1" max="200" step="0.5" value="${b.w}" data-bed-w="${esc(name)}" aria-label="${esc(name)} width in feet">
          ${used.has(name) ? '<span></span>' : `<button class="close" type="button" data-ss="rmbed" data-name="${esc(name)}" aria-label="Remove ${esc(name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`}
        </div>`).join('')}</div>
      <div class="bedrow" style="grid-template-columns:minmax(0,1fr) auto"><input class="input" id="s-newbed" placeholder="New bed name, e.g. Garden bed 3" value="${esc(newBedName)}" autocomplete="off"><button class="btn" type="button" data-ss="addbed">Add bed</button></div>
      <button class="btn primary block" type="button" data-ss="save" ${d.state ? '' : 'disabled style="opacity:.5"'}>Save season</button>`;
  };
  openSheet('Season setup', renderFn);
  const body = $('#sheetBody');
  body.onclick = e => {
    const b = e.target.closest('[data-ss]');
    if (!b) return;
    const act = b.dataset.ss;
    if (act === 'year') { d.year = Number(b.dataset.y); sheetRefresh(); }
    else if (act === 'reset') { d.lf = ''; d.ff = ''; sheetRefresh(); }
    else if (act === 'rmbed') { delete d.beds[b.dataset.name]; sheetRefresh(); }
    else if (act === 'addbed') {
      const name = ($('#s-newbed').value || '').trim().slice(0, 60);
      if (!name) { $('#s-newbed').focus(); return; }
      if (!Object.keys(d.beds).some(k => k.toLowerCase() === name.toLowerCase())) d.beds[name] = { ...DEFAULT_BED };
      newBedName = ''; sheetRefresh();
    } else if (act === 'save') {
      if (!d.state) return;
      if (!Object.keys(d.beds).length) d.beds = defaultPlan().beds;
      closeSheet(); Plan.save(d); tab = 'planner'; render(); toast('Season saved');
    }
  };
  body.onchange = e => {
    const t = e.target;
    if (t.id === 's-state') { d.state = t.value; d.lf = ''; d.ff = ''; sheetRefresh(); }
    else if (t.id === 's-lf' && t.value) { d.lf = t.value.slice(5); }
    else if (t.id === 's-ff' && t.value) { d.ff = t.value.slice(5); }
  };
  body.oninput = e => {
    const t = e.target;
    const n = Math.min(200, Math.max(1, Number(t.value) || 1));
    if (t.dataset.bedL && d.beds[t.dataset.bedL]) d.beds[t.dataset.bedL].l = n;
    if (t.dataset.bedW && d.beds[t.dataset.bedW]) d.beds[t.dataset.bedW].w = n;
    if (t.id === 's-newbed') newBedName = t.value;
  };
}

/* Add / edit a crop in the plan */
function openPlanItem(id, presetType, presetBed) {
  const s = seasonInfo();
  if (!s) { openSeason(); return; }
  const existing = id ? Plan.data.items.find(i => i.id === id) : null;
  const bedNames = Object.keys(Plan.data.beds);
  const it = existing ? clone(existing) : {
    id: newId(), type: GROW[presetType] ? presetType : '', qty: 1,
    bed: presetBed && Plan.data.beds[presetBed] ? presetBed : bedNames[0] || '', dtm: 0, notes: '',
  };
  let picking = !it.type, query = '', confirmDel = false;

  const preview = () => {
    if (!it.type) return '';
    const r = schedule(it, s), g = r.g;
    const usage = bedUsage({ ...Plan.data, items: Plan.data.items.filter(x => x.id !== it.id) }).find(b => b.name === it.bed);
    const free = usage ? usage.area - usage.used : 0;
    const need = g.sq * it.qty;
    const fits = Math.floor(Math.max(0, free) / g.sq);
    const lines = [];
    lines.push(['Space', `${fmtSq(need)} sq ft total, about ${spacingIn(g)} in. between plants.`]);
    if (usage) lines.push(['Fits', need <= free ? `Yes. ${esc(it.bed)} has room for up to ${fits} of these.` : `<span style="color:var(--warn)">Not quite. ${esc(it.bed)} only has room for about ${fits}.</span>`]);
    if (r.startFrom) lines.push(['Start seeds', `${fmtD(r.startFrom, s.year)} to ${fmtD(r.startTo, s.year)}, indoors${g.m === 'either' ? ' (optional)' : ''}`]);
    lines.push([g.m === 'direct' ? 'Sow outside' : 'Plant out', fmtD(r.plantOut, s.year) + (g.m === 'fall' ? ' (this fall)' : '')]);
    if (r.harvestStart) lines.push([harvestVerb(it.type), `${fmtD(r.harvestStart, s.year)} to ${fmtD(r.harvestEnd, s.year)}`]);
    else if (r.harvestText) lines.push(['Harvest', esc(r.harvestText)]);
    if (r.fallSow) lines.push(['Fall crop', `Sow again around ${fmtD(r.fallSow, s.year)}`]);
    return `<div class="preview">${lines.map(([k, v]) => `<div class="line"><span>${k}</span><span>${v}</span></div>`).join('')}
      ${r.warnings.map(w => `<p class="warnline" style="margin:0">${esc(w)}</p>`).join('')}
      ${g.note ? `<p class="small muted" style="margin:0">${esc(g.note)}</p>` : ''}</div>`;
  };

  const renderFn = () => {
    if (picking) {
      const q = query.trim().toLowerCase();
      const list = Object.keys(GROW).map(k => DB[k]).filter(x => !q || x.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
      return `<div class="field"><label for="pi-q">What do you want to grow?</label>
        <div class="search">${ICON.search}<input class="input" id="pi-q" type="search" placeholder="Search crops, herbs, flowers…" value="${esc(query)}" autocomplete="off"></div>
        <div class="picker" style="max-height:none">${list.map(x => {
          const g = GROW[x.id];
          const how = { transplant: 'Start indoors', direct: 'Sow outside', either: 'Indoors or outside', buy: 'Buy a starter plant', perennial: 'Perennial', fall: 'Plant in fall' }[g.m];
          return `<button class="pick" type="button" data-pi="pick" data-type="${x.id}">${mono(x.name, x.cat, 'sm')}<span class="row-main"><span class="row-title">${esc(x.name)}</span><span class="row-sub">${how} · ${spacingIn(g)} in. apart${g.dtm ? ` · ${g.dtm} days` : ''}</span></span></button>`;
        }).join('') || '<p class="small muted" style="padding:12px">No match. The planner covers outdoor crops, herbs and flowers.</p>'}</div></div>`;
    }
    const d = DB[it.type], g = GROW[it.type];
    return `<div class="chosen">${mono(d.name, d.cat, 'sm')}<span class="row-main" style="flex:1"><span class="row-title">${esc(d.name)}</span><span class="row-sub">${esc(CATS[d.cat])}</span></span>${existing ? '' : '<button class="btn ghost" type="button" data-pi="repick">Change</button>'}</div>
      <div class="field"><span class="label">How many plants</span><div class="stepper"><button type="button" data-pi="qty" data-n="-1" aria-label="Fewer">−</button><output id="pi-qty">${it.qty}</output><button type="button" data-pi="qty" data-n="1" aria-label="More">+</button></div></div>
      <div class="field"><span class="label">Bed</span><div class="spots">${bedNames.map(b => `<button type="button" data-pi="bed" data-name="${esc(b)}" aria-pressed="${b === it.bed}">${esc(b)}</button>`).join('')}</div>
        <span class="small muted">Add beds or change sizes in season setup.</span></div>
      ${g.dtm ? `<div class="field"><label for="pi-dtm">Days to harvest <span class="muted">(from your seed packet)</span></label><input class="input" id="pi-dtm" type="number" inputmode="numeric" min="1" max="400" placeholder="${g.dtm} (typical)" value="${it.dtm || ''}"></div>` : ''}
      <div class="field"><label for="pi-notes">Variety or notes</label><input class="input" id="pi-notes" value="${esc(it.notes)}" placeholder="e.g. Sungold, Early Girl" autocomplete="off"></div>
      <div id="pi-preview">${preview()}</div>
      <button class="btn primary block" type="button" data-pi="save">${existing ? 'Save changes' : 'Add to plan'}</button>
      ${existing ? `<button class="btn block" type="button" data-pi="planted">I planted it: add to My plants</button>
        ${confirmDel ? `<div class="card warn"><h3>Remove ${esc(d.name)} from the plan?</h3><div class="btn-row"><button class="btn" type="button" data-pi="nodel">Keep</button><button class="btn danger" type="button" data-pi="del">Remove</button></div></div>`
          : '<button class="btn ghost" type="button" data-pi="askdel" style="color:var(--warn);justify-self:start">Remove from plan</button>'}` : ''}`;
  };

  openSheet(existing ? 'Edit crop' : 'Add to plan', renderFn);
  const body = $('#sheetBody');
  const updatePreview = () => { const el = $('#pi-preview'); if (el) el.innerHTML = preview(); };
  body.onclick = async e => {
    const b = e.target.closest('[data-pi]');
    if (!b) return;
    const act = b.dataset.pi;
    if (act === 'pick') { it.type = b.dataset.type; it.dtm = 0; picking = false; sheetRefresh(); body.scrollTop = 0; }
    else if (act === 'repick') { picking = true; query = ''; sheetRefresh(); }
    else if (act === 'qty') { it.qty = Math.min(500, Math.max(1, it.qty + Number(b.dataset.n))); $('#pi-qty').textContent = it.qty; updatePreview(); }
    else if (act === 'bed') { it.bed = b.dataset.name; body.querySelectorAll('[data-pi="bed"]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.name === it.bed))); updatePreview(); }
    else if (act === 'askdel') { confirmDel = true; sheetRefresh(); }
    else if (act === 'nodel') { confirmDel = false; sheetRefresh(); }
    else if (act === 'del') {
      const p = clone(Plan.data);
      p.items = p.items.filter(x => x.id !== it.id);
      Object.keys(p.done).forEach(k => { if (k.startsWith(it.id + ':')) delete p.done[k]; });
      closeSheet(); Plan.save(p); toast(`Removed ${DB[it.type].name} from the plan`);
    } else if (act === 'save') {
      const p = clone(Plan.data);
      const i = p.items.findIndex(x => x.id === it.id);
      if (i >= 0) p.items[i] = it; else p.items.push(it);
      closeSheet(); Plan.save(p); toast(existing ? 'Saved' : `Added ${DB[it.type].name} to the plan`);
    } else if (act === 'planted') {
      const t = todayISO();
      const ok = await Store.save({
        id: newId(), type: it.type, customType: '', name: it.notes ? `${DB[it.type].name} (${it.notes.slice(0, 40)})` : '',
        setting: 'garden', spot: it.bed, waterEvery: DB[it.type].water, lastWatered: t, planted: t,
        notes: `${it.qty} planted from the season plan.`, light: '', history: [t], created: Date.now(),
      });
      if (ok) {
        const p = clone(Plan.data);
        p.done[`${it.id}:plant`] = true;
        closeSheet(); Plan.save(p); toast(`Added ${DB[it.type].name} to My plants`);
      }
    }
  };
  body.oninput = e => {
    const t = e.target;
    if (t.id === 'pi-q') {
      query = t.value;
      const pos = t.selectionStart;
      sheetRefresh();
      const inp = $('#pi-q'); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (_) {}
    } else if (t.id === 'pi-dtm') { it.dtm = Math.min(400, Math.max(0, Math.round(Number(t.value) || 0))); updatePreview(); }
    else if (t.id === 'pi-notes') { it.notes = t.value.slice(0, 500); }
  };
  body.onchange = null;
  if (picking) setTimeout(() => $('#pi-q')?.focus(), 250);
}

async function markWatered(id) {
  const p = Store.get(id);
  if (!p) return;
  const before = { lastWatered: p.lastWatered || '', history: p.history || [] };
  const t = todayISO();
  const history = [...(p.history || []).filter(d => d !== t), t].slice(-12);
  const ok = await Store.save({ ...p, lastWatered: t, history });
  if (ok) toast(`Watered ${displayName(p)}`, 'Undo', () => {
    const cur = Store.get(id); if (cur) Store.save({ ...cur, ...before });
  });
}
async function waterAll() {
  const due = Store.plants.filter(isDue);
  for (const p of due) {
    const t = todayISO();
    await Store.save({ ...p, lastWatered: t, history: [...(p.history || []).filter(d => d !== t), t].slice(-12) });
  }
  toast(`Watered ${plural(due.length, 'plant')}`);
}

let toastTimer;
function toast(msg, actionLabel, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ''}`;
  el.hidden = false;
  if (actionLabel) el.querySelector('button').onclick = () => { el.hidden = true; action(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, actionLabel ? 5000 : 2400);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { tab = ds.tab; render(); window.scrollTo(0, 0); return; }
  if (ds.task) { toggleTask(ds.task); return; }
  if ('season' in ds) { openSeason(); return; }
  if (ds.planItem) { openPlanItem(ds.planItem); return; }
  if ('planAdd' in ds) { openPlanItem(null, ds.planAdd, ds.bed); return; }
  if (ds.filter) { filter = ds.filter; render(); return; }
  if (ds.open) { openDetail(ds.open); return; }
  if (ds.water) { markWatered(ds.water); return; }
  if ('waterAll' in ds) { waterAll(); return; }
  if (ds.edit) { openForm(ds.edit); return; }
  if (ds.confirmDel) { const p = Store.get(ds.confirmDel); closeSheet(); Store.remove(ds.confirmDel).then(ok => ok && toast(`Removed ${displayName(p)}`)); return; }
  if (ds.quick) { openForm(null, ds.quick); return; }
  if ('add' in ds) { openForm(null); return; }
  if ('backup' in ds) { openBackup(); return; }
  if (ds.lookup) { openLookup(ds.lookup); return; }
});
$('#fab').addEventListener('click', () => tab === 'planner' ? openPlanItem(null) : openForm(null));
$('#backupBtn').addEventListener('click', openBackup);
$('#sheetClose').addEventListener('click', closeSheet);
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetRoot').hidden) closeSheet(); });
document.addEventListener('input', e => {
  if (e.target.id === 'lookupSearch') {
    lookupQuery = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const inp = $('#lookupSearch'); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (_) {}
  }
});
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 4), { passive: true });

// Re-render at midnight-ish changes when the page comes back into view
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

render();
Store.init();
</script>
</body>
